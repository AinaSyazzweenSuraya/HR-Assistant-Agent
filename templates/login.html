<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · HR Policy Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
  <main class="login-layout" id="main">
    <div class="card">
      <div class="brand"><span class="brand-mark" aria-hidden="true">h<span>.</span></span><span>HR Policies</span></div>
      <h1>Sign in</h1>
      <form method="post">
        <label for="email">Company email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required autofocus value="{{ request.form.get('email', '') }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p class="login-help">Need access? Contact HR.</p>
    </div>
  </main>
</body>
</html>
