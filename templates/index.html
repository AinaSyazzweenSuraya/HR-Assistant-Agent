<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Policy Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-page">
  {% include "_header.html" %}

  <main class="chat-shell" id="main">
    <div id="log" aria-live="polite">
      <div class="empty" id="empty">
        <h1>How can we help?</h1>
        <p>Choose a topic or ask a question.</p>
        <div class="chips">
          <button class="chip" type="button" data-question="How many days of annual leave do I get?"><span class="topic-icon" aria-hidden="true">☼</span><span><strong>Leave</strong></span><span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
          <button class="chip" type="button" data-question="What is the hotel limit for business trips?"><span class="topic-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span><span><strong>Travel</strong></span><span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
          <button class="chip" type="button" data-question="How much is my outpatient medical allowance?"><span class="topic-icon" aria-hidden="true">+</span><span><strong>Medical</strong></span><span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
          <button class="chip" type="button" data-question="How do I submit a claim?"><span class="topic-icon" aria-hidden="true">≡</span><span><strong>Claims</strong></span><span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>
        </div>
      </div>
    </div>

    <div class="composer-wrap"><label class="composer-label" for="input">Your question</label>
    <div class="composer">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about your company policy…" aria-label="Your question"></textarea>
      <button class="primary" id="send" type="button">Ask <span aria-hidden="true">↑</span></button>
    </div>
    </div>
    <div class="disclaimer">For exceptions, contact HR.</div>
  </main>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
