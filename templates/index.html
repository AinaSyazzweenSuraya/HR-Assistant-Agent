<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Policy Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="chat-page">
  {% include "header.html" %}

  <main class="chat-shell" id="main">
    <div id="log" aria-live="polite">
      <div class="empty" id="empty">
        <h1>How can we help?</h1>
        <p>Choose a topic or ask a question.</p>
        <div class="chips">
          <button class="chip leave" type="button" data-question="How many days of annual leave do I get?">
            <span class="topic-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
            <span><strong>Leave</strong></span>
            <span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
          </button>
          <button class="chip travel" type="button" data-question="What is the hotel limit for business trips?">
            <span class="topic-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
            <span><strong>Travel</strong></span>
            <span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
          </button>
          <button class="chip medical" type="button" data-question="How much is my outpatient medical allowance?">
            <span class="topic-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span>
            <span><strong>Medical</strong></span>
            <span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
          </button>
          <button class="chip claims" type="button" data-question="How do I submit a claim?">
            <span class="topic-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>
            <span><strong>Claims</strong></span>
            <span class="topic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18 18 6M6 6h12v12"/></svg></span>
          </button>
        </div>
      </div>
    </div>

    <div class="composer-wrap"><label class="composer-label" for="input">Your question</label>
    <div class="composer">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about your company policy…" aria-label="Your question"></textarea>
      <button class="primary" id="send" type="button">Ask <span aria-hidden="true">↑</span></button>
    </div>
    </div>
    <div class="disclaimer">For exceptions, contact HR.</div>
  </main>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
