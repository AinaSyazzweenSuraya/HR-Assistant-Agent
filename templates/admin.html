<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage policies · HR Policy Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="admin-page">
  {% include "header.html" %}

  <main class="admin" id="main">
    <div class="admin-heading"><h1>Policies</h1></div>
    <section class="panel upload-panel">
      <h2>Upload a policy</h2>
      <p class="note">Use the same name to update an existing policy.</p>
      <form id="upload">
        <div class="grid2">
          <div><label for="name">Policy name</label><input id="name" name="name" required placeholder="Annual Leave Policy"></div>
          <div><label for="category">Category</label>
            <select id="category" name="category">{% for c in categories %}<option value="{{ c }}">{{ c|capitalize }}</option>{% endfor %}</select></div>
          <div><label for="access_level">Who can see it</label>
            <input id="access_level" name="access_level" value="all" list="levels">
            <datalist id="levels"><option value="all"><option value="permanent"><option value="contract"><option value="grade:G3"><option value="hr_only"></datalist></div>
          <div><label for="file">File (PDF, DOCX or TXT)</label><input id="file" name="file" type="file" accept=".pdf,.docx,.txt" required></div>
          <div><label for="effective_date">Effective from</label><input id="effective_date" name="effective_date" type="date"></div>
          <div><label for="expiry_date">Expires on (optional)</label><input id="expiry_date" name="expiry_date" type="date"></div>
        </div>
        <button class="primary" type="submit">Upload policy</button>
        <div id="status" role="status"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Active policies</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Category</th><th>Version</th><th>Access</th><th>Effective</th><th>Expires</th><th>Chunks</th><th></th></tr></thead>
        <tbody id="docs"></tbody>
      </table></div>
    </section>
  </main>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
